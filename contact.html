<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/stylecc.css">
    <title> ETH FREE FIRE </title>
</head>
<body>
   <div class="container">
    <h1>Welcome to Ethiopian Free Fire  </h1>
    <div class="Contact-box">
       <div class="Contact-left">
        <h3>Set your request</h3>
            <form>

            <div class="input-row">  
                <div class="input-group">
                    <label>Name</label>
                    <input type="text" placeholder="Your Name">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Your Email">
                </div>
              
            </div>
            <div class="input-row">  
                <div class="input-group">
                    <label>Phone</label>
                    <input type="text" placeholder="+2519xxxx xxxx">
                </div>
                
              
            </div>
            <label>Message</label>
            <textarea rows="5" placeholder="Your Message"></textarea>
            <button type="submit">Submit

            </button>


            </form>
        </div>
        <div class="Contact-right">
            <h3>Reach Us</h3>
            <table>
                <tr>
                    <td>Email</td>
                    <td>Contact@gmail.com</td>
                </tr>
                <tr>
                    <td>Phone</td>
                    <td>+2519xx xxx xxx</td>
                </tr>
                <tr>
                    <td>Address</td>
                    <td>Ethiopia</td>
        
                </tr>
            </table>
            


        </div>
    </div>
   </div> 
</body>
</html>
